<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Kansen — a moment of appreciation</title>
  <desc>An open right palm and forearm extend from right to left in appreciation, angled gently upward toward a Hindustani classical concert on an open stage. Faint audience silhouettes remain in the background.</desc>
  <defs>
    <linearGradient id="hall" x2="0" y2="1">
      <stop stop-color="#36574B"/><stop offset="1" stop-color="#142F29"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="22%" r="65%">
      <stop stop-color="#E5CD90" stop-opacity=".27"/><stop offset="1" stop-color="#E5CD90" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F1CF99"/><stop offset="1" stop-color="#C99260"/>
    </linearGradient>
    <linearGradient id="kurta" x1="0" y1="0" x2="1" y2=".6">
      <stop stop-color="#E5DFCB"/><stop offset="1" stop-color="#BEBDA5"/>
    </linearGradient>
    <linearGradient id="stage" x2="0" y2="1">
      <stop stop-color="#B6A075"/><stop offset="1" stop-color="#827151"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#hall)"/>
    <rect width="512" height="340" fill="url(#glow)"/>
    <!-- An open platform extends beyond the icon, without an enclosing arch. -->
    <path d="M0 263C137 256 369 256 512 263V291H0Z" fill="url(#stage)"/>
    <path d="M0 291H512V303H0Z" fill="#5E5740"/>
    <path d="M0 290H512" stroke="#D1BA87" stroke-width="2" opacity=".55"/>
    <ellipse cx="234" cy="261" rx="96" ry="11" fill="#685E43" opacity=".45"/>
    <!-- Seated vocalist, softly suggested in the distance. -->
    <g fill="#C8BB91">
      <path d="M209 174C207 160 214 149 227 148C240 148 247 158 246 171C245 185 238 191 228 192C217 191 211 184 209 174Z"/>
      <path d="M217 190C205 198 202 214 197 232C191 237 183 241 176 247C168 254 177 262 188 261C204 260 216 254 227 251C243 255 255 262 269 261C281 260 287 254 277 247L256 234C252 218 250 201 240 194C233 190 225 188 217 190Z"/>
    </g>
    <path d="M215 205C208 221 199 227 184 229M241 207C250 215 261 218 270 211" fill="none" stroke="#D3C49A" stroke-width="7" stroke-linecap="round"/>
    <path d="M197 213L192 251M192 251L181 257M192 251L205 257" fill="none" stroke="#64715A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M197 213L211 208" stroke="#64715A" stroke-width="4" stroke-linecap="round"/>
    <!-- Tanpura beside the artist. -->
    <g transform="rotate(7 302 241)">
      <ellipse cx="302" cy="242" rx="16" ry="20" fill="#AF9366"/>
      <path d="M302 233V133" stroke="#C3A97A" stroke-width="8" stroke-linecap="round"/>
      <path d="M302 139V252" stroke="#E0CA99" stroke-width="1.5"/>
      <path d="M296 148H307M296 161H307" stroke="#C3A97A" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Quiet rows of other listeners, in low-contrast tones. -->
    <g fill="#66786A" opacity=".16">
      <ellipse cx="45" cy="330" rx="22" ry="26" transform="rotate(-8 45 330)"/>
      <path d="M1 414C1 375 14 356 43 355C72 354 88 378 88 414Z"/>
      <ellipse cx="112" cy="310" rx="18" ry="22"/>
      <path d="M80 374C80 344 90 331 111 331C133 331 144 346 145 374Z"/>
      <ellipse cx="413" cy="326" rx="22" ry="27" transform="rotate(9 413 326)"/>
      <path d="M371 413C372 376 385 351 413 351C442 351 457 377 457 413Z"/>
      <ellipse cx="484" cy="309" rx="19" ry="23"/>
      <path d="M451 380C452 346 461 331 483 331C507 331 518 349 520 380Z"/>
    </g>
    <g fill="#66786A" opacity=".13">
      <ellipse cx="187" cy="329" rx="19" ry="24" transform="rotate(5 187 329)"/>
      <path d="M151 401C151 369 163 352 187 352C211 352 224 372 224 401Z"/>
      <ellipse cx="263" cy="320" rx="18" ry="22"/>
      <path d="M230 383C232 354 241 341 263 341C286 341 296 359 297 383Z"/>
      <ellipse cx="338" cy="331" rx="21" ry="25" transform="rotate(-6 338 331)"/>
      <path d="M299 407C301 373 312 355 338 355C363 355 377 375 378 407Z"/>
    </g>
    <g fill="#38584A" opacity=".3">
      <ellipse cx="128" cy="392" rx="25" ry="30" transform="rotate(-5 128 392)"/>
      <path d="M81 485C83 443 98 420 128 420C160 420 177 447 177 485Z"/>
      <ellipse cx="235" cy="408" rx="26" ry="31"/>
      <path d="M186 512C188 466 203 437 235 437C268 437 287 467 288 512Z"/>
      <ellipse cx="349" cy="401" rx="26" ry="31"/>
      <path d="M301 503C303 457 318 431 349 431C381 431 399 461 400 503Z"/>
