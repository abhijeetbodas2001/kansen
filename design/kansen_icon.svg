    <g fill="#0F2924" opacity=".65">
      <ellipse cx="25" cy="414" rx="30" ry="35"/>
      <path d="M-35 512C-31 466 -12 446 24 445C60 444 79 470 83 512Z"/>
      <ellipse cx="434" cy="420" rx="31" ry="36"/>
      <path d="M373 512C376 471 397 451 434 451C472 451 492 473 497 512Z"/>
    </g>
    <!-- Right palm facing the viewer; forearm enters from the right, below the elbow. -->
    <g transform="translate(84 176) scale(.72) rotate(47 345 370)">
    <path d="M660 403.00
      C510 400.00 404 371.00 348 353.00
      C327 347.58 313 339.01 307 326.36
      L302 306.78C300 300.84 291 299.09 286 303.18C282 306.11 285 311.96 286 316.06
      L288 325.42C282 326.01 276 323.67 270 321.33
      L209 302.60C199 299.09 190 300.84 188 304.94C186 309.04 192 311.96 199 314.30L242 328.93
      L183 313.13C172 310.21 163 312.55 162 317.23C161 321.33 168 323.67 175 326.01L235 341.22
      L187 330.69C176 328.35 168 331.27 169 335.96C169 340.05 176 341.81 184 343.56L233 352.93
      L201 348.24C190 346.49 184 349.41 186 353.51C188 357.02 194 358.19 201 359.95
      L244 369.31C265 374.58 284 376.33 305 375.55
      C324 382.71 339 389.30 358 399.00
      C416 419.00 530 459.00 660 507.00Z" fill="url(#skin)"/>
