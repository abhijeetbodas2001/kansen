    <path d="M291 331.27C307 336.59 311 346.65 304 356.15
      M252 335.96C268 343.56 281 346.49 291 346.49
      M247 351.17C263 358.19 278 359.95 290 358.19"
      fill="none" stroke="#B58357" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <path d="M212 313.13L209 316.06M193 321.91L190 324.84M201 338.88L199 341.81M215 352.93L214 355.27"
      fill="none" stroke="#B58357" stroke-width="1.8" stroke-linecap="round" opacity=".3"/>
    </g>
  </g>
</svg>
